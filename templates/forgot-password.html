<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-teal: #0d9488;
            --dark-teal: #134e4a;
            --light-teal: #5eead4;
            --coral: #f97316;
            --dark-coral: #ea580c;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary-teal), var(--coral));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-teal);
            margin-bottom: 20px;
        }

        .auth-logo i {
            font-size: 32px;
        }

        .auth-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-teal), var(--coral));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .auth-icon i {
            font-size: 36px;
            color: white;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--gray-500);
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--gray-700);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--gray-50);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-teal);
            background: white;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--coral), var(--dark-coral));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--gray-500);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary-teal);
        }

        /* Success State */
        .success-state {
            display: none;
            text-align: center;
        }

        .success-state.show {
            display: block;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--success), #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: successPop 0.5s ease;
        }

        @keyframes successPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .success-icon i {
            font-size: 40px;
            color: white;
        }

        .success-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 10px;
        }

        .success-message {
            color: var(--gray-500);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .email-highlight {
            color: var(--primary-teal);
            font-weight: 600;
        }

        /* Error Message */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Initial State */
        .initial-state {
            display: block;
        }

        .initial-state.hide {
            display: none;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .auth-logo {
                font-size: 24px;
            }

            .auth-title {
                font-size: 20px;
            }

            .auth-icon,
            .success-icon {
                width: 60px;
                height: 60px;
            }

            .auth-icon i,
            .success-icon i {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <!-- Initial State - Email Form -->
        <div class="initial-state" id="initialState">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <i class="fas fa-briefcase"></i>
                    SkillConnect
                </a>
                <div class="auth-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">No worries! Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="btnText">Send Reset Link</span>
                    <i class="fas fa-spinner fa-spin" id="btnSpinner" style="display: none;"></i>
                </button>
            </form>

            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>

        <!-- Success State -->
        <div class="success-state" id="successState">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="success-title">Check Your Email</h2>
            <p class="success-message">
                We've sent a password reset link to<br>
                <span class="email-highlight" id="sentEmail"></span>
            </p>
            <p class="auth-subtitle" style="margin-bottom: 20px;">
                Didn't receive the email? Check your spam folder or try again.
            </p>
            <button class="btn-primary" onclick="resetForm()">
                <i class="fas fa-redo"></i>
                Try Another Email
            </button>
            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://skillconnect-backend-jcn0.onrender.com';
        
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const initialState = document.getElementById('initialState');
        const successState = document.getElementById('successState');
        const sentEmail = document.getElementById('sentEmail');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showError('Please enter your email address');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }

            // Show loading
            setLoading(true);
            hideError();

            try {
                const response = await fetch(`${API_BASE_URL}/api/accounts/forgot-password/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success state
                    sentEmail.textContent = email;
                    initialState.classList.add('hide');
                    successState.classList.add('show');
                } else {
                    showError(data.error || 'Something went wrong. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                // Still show success to prevent email enumeration
                sentEmail.textContent = email;
                initialState.classList.add('hide');
                successState.classList.add('show');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.style.display = loading ? 'none' : 'inline';
            btnSpinner.style.display = loading ? 'inline' : 'none';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function resetForm() {
            emailInput.value = '';
            initialState.classList.remove('hide');
            successState.classList.remove('show');
            hideError();
        }
    </script>
</body>
</html>
